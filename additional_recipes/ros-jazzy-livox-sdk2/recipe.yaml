context:
  name: ros-jazzy-livox-sdk2
  version: 1.3.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  git: https://github.com/Livox-SDK/Livox-SDK2.git
  target_directory: ${{ name|lower }}
  patches:
    - patches/001-cstdint.patch

build:
  number: 1
  script:
    - build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake 3.*
    - ninja
    - numpy

about:
  homepage: https://github.com/Livox-SDK/Livox-SDK2
  license: MIT
  summary: Consists of Livox SDK2 core code, Livox SDK2 APIs and three samples.
  description: Livox SDK2 API provides a set of C-style APIs, which can be conveniently integrated in C/C++ programs.
  repository: https://github.com/Livox-SDK/Livox-SDK2.git
